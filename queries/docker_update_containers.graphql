mutation DockerUpdateContainers($ids: [PrefixedID!]!) {
  docker {
    updateContainers(ids: $ids) {
      id
      names
      image
      imageId
      command
      created
      lanIpPorts
      sizeRootFs
      sizeRw
      sizeLog
      labels
      state
      status
      networkSettings
      mounts
      autoStart
      autoStartOrder
      autoStartWait
      templatePath
      projectUrl
      registryUrl
      supportUrl
      iconUrl
      webUiUrl
      shell
      isOrphaned
      isUpdateAvailable
      isRebuildReady
      tailscaleEnabled
    }
  }
}
